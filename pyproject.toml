[project]
name = "stock_guard"
authors = [{ name = "Reformiqo", email = "consultant.reformiqo@gmail.com" }]
description = "Keeps Stock Ledger, Bin, Stock Balance and GL Stock In Hand consistent when late (back-dated) stock entries are posted."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
